name: Build JavaScriptCore (Debug with Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build ccache \
            bison flex gperf perl ruby python3 git \
            libicu-dev libxml2-dev libxslt1-dev \
            sqlite3 libsqlite3-dev curl unzip wget

      - name: Install Clang 18 (LLVM official)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-18 100
          cc --version
          c++ --version

      - name: Build libbacktrace
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Build JavaScriptCore (JSC only)
        run: |
          Tools/Scripts/build-webkit --jsc-only --debug --cmakeargs="\
            -DUSE_SYSTEM_LIBBACKTRACE=ON \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DUSE_EXPERIMENTAL_CXX=OFF \
            -DCMAKE_C_FLAGS=-Wno-unknown-warning-option \
            -DCMAKE_CXX_FLAGS='-std=c++20 -Wno-unknown-warning-option -Wno-error'"