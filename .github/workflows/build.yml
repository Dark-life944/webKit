name: Build WebKit with GTK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # استخدام Ubuntu لبناء WebKit مع GTK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # سحب آخر commit فقط لتقليل حجم البيانات

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            ~/.ccache
            ~/webkitgtk-libs
            ~/.cpanm
          key: ${{ runner.os }}-webkitgtk-${{ hashFiles('Tools/gtk/install-dependencies', 'Tools/Scripts/update-webkitgtk-libs') }}
          restore-keys: |
            ${{ runner.os }}-webkitgtk-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl python3 ruby cmake ninja-build gperf \
                                 libicu-dev libssl-dev libpng-dev libjpeg-dev \
                                 libxml2-dev libxslt1-dev libgtk-3-dev \
                                 libwebkit2gtk-4.0-dev
          # تثبيت Perl ووحداته
          sudo apt-get install -y libperl-dev cpanminus
          sudo cpanm --force JSON File::Copy::Recursive  # تثبيت وحدات Perl إذا لزم الأمر

      - name: Install WebKitGTK Dependencies
        run: perl ./Tools/gtk/install-dependencies  # تشغيل سكريبت Perl لتثبيت الـ dependencies

      - name: Update WebKitGTK Libraries
        run: perl ./Tools/Scripts/update-webkitgtk-libs  # تشغيل سكريبت Perl لتحديث المكتبات

      - name: Build WebKit (GTK, Debug)
        run: perl ./Tools/Scripts/build-webkit --gtk --debug  # تشغيل سكريبت Perl لبناء WebKit