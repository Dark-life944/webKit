name: Build WebKitGTK (Debug with Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare system
        run: |
          sudo apt-get update
          # libunwind-dev مطلوب لبناء gstreamer
          sudo apt-get install -y libunwind-dev equivs

          # نمنع git-svn من التثبيت عن طريق إنشاء dummy package
          cat <<EOF > git-svn-dummy
          Section: misc
          Priority: optional
          Standards-Version: 3.9.2

          Package: git-svn
          Version: 1:99
          Maintainer: Dummy <dummy@example.com>
          Architecture: all
          Description: dummy package to satisfy dependency
           This is a fake git-svn package.
          EOF

          equivs-build git-svn-dummy
          sudo dpkg -i git-svn_99_all.deb

      - name: Install WebKitGTK dependencies manually
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git python3 python3-dev \
            libglib2.0-dev libgtk-3-dev libjpeg-dev libpng-dev libwebp-dev \
            libxslt1-dev libicu-dev libsqlite3-dev libxml2-dev \
            libwoff-dev libharfbuzz-dev libfreetype6-dev libsecret-1-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsoup2.4-dev libenchant-2-dev liblzma-dev zlib1g-dev \
            ruby bison flex clang \
            libtasn1-6 libtasn1-6-dev

      - name: Use Clang instead of GCC
        run: |
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++ 100
          cc --version
          c++ --version

      - name: Build WebKitGTK Debug
        run: Tools/Scripts/build-webkit --gtk --debug