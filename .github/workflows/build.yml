name: Build WebKitGTK (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare system
        run: |
          sudo apt-get update
          # libunwind-dev مطلوب لبناء gstreamer
          sudo apt-get install -y libunwind-dev equivs

          # نمنع git-svn من التثبيت عن طريق إنشاء dummy package
          cat <<EOF > git-svn-dummy
          Section: misc
          Priority: optional
          Standards-Version: 3.9.2

          Package: git-svn
          Version: 1:99
          Maintainer: Dummy <dummy@example.com>
          Architecture: all
          Description: dummy package to satisfy dependency
           This is a fake git-svn package.
          EOF

          equivs-build git-svn-dummy
          sudo dpkg -i git-svn_99_all.deb

      - name: Run WebKitGTK dependency installer
        env:
          DEBIAN_FRONTEND: noninteractive
        run: Tools/gtk/install-dependencies

      - name: Update WebKitGTK libs
        run: Tools/Scripts/update-webkitgtk-libs

      - name: Build WebKitGTK Debug
        run: Tools/Scripts/build-webkit --gtk --debug