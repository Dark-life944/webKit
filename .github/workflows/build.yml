name: Build WebKitGTK (Debug with Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare dummy git-svn
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev equivs
          cat <<EOF > git-svn-dummy
          Section: misc
          Priority: optional
          Standards-Version: 3.9.2

          Package: git-svn
          Version: 1:99
          Maintainer: Dummy <dummy@example.com>
          Architecture: all
          Description: dummy package to satisfy dependency
           This is a fake git-svn package.
          EOF

          equivs-build git-svn-dummy
          sudo dpkg -i git-svn_99_all.deb

      - name: Run WebKitGTK dependency installer
        run: |
          sudo apt-get update
          Tools/gtk/install-dependencies

      - name: Install extra dependencies manually
        run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y \
            build-essential clang clang-tools cmake ccache ninja-build \
            bison flex gperf lld git g++ pkg-config \
            libcairo2-dev libgtk-3-dev libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwebp-dev libjpeg-dev libpng-dev libpango1.0-dev \
            libevdev-dev libwayland-dev libxslt1-dev libglib2.0-dev \
            libgirepository1.0-dev libsoup-3.0-dev libtasn1-6-dev \
            libgcrypt20-dev libenchant-2-dev \
            sqlite3 libsqlite3-dev subversion perl ruby \
            fonts-comfortaa language-pack-en \
            ncdu p7zip-full p7zip-rar curl unzip 

      - name: Use Clang instead of GCC
        run: |
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++ 100
          cc --version
          c++ --version

      - name: Build libbacktrace
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Build WebKitGTK Debug
        run: Tools/Scripts/build-webkit --gtk --debug --cmakeargs="-DUSE_JPEGXL=OFF -DENABLE_WEBXR=OFF -DUSE_THUNDER=OFF -DENABLE_THUNDER=OFF -DENABLE_RDK=OFF"